exploration_nav2_planner:
  ros__parameters:
    # Plan freely to the observed center goal; MPPI applies soft center preference.
    input_timeout: 2.0
    replan_interval: 1.0
    planning_timeout: 4.0
    retry_delay: 0.5
    # Matches the existing follower's route update distance.
    target_update_distance: 0.15
    # GridBased may return a nearby goal within its existing 0.5 m tolerance.
    endpoint_tolerance: 0.6
    start_tolerance: 0.8
    input_frame: odom_init
    planning_frame: map
    planner_id: GridBased

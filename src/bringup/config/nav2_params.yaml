
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0 #控制频率  11-08: was 50 (missed its rate 500-4500x per run)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3 #最大容忍时间 超过后会触发恢复行为
    progress_checker_plugin: "progress_checker" #
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 6.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25 #0.25米以内
      yaw_goal_tolerance: 0.2 #差速底盘需要在终点对准目标方向
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40   # 11-08: was 100 (horizon kept at 2 s)
      model_dt: 0.05   # 11-08: was 0.02, = 1/controller_frequency
      batch_size: 1000   # 11-08: was 1500
      vx_std: 0.25
      wz_std: 0.25
      vx_max: 0.3
      vx_min: 0.0
      wz_max: 0.35
      ax_max: 0.3
      ax_min: -0.6
      az_max: 0.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.25
      gamma: 0.02
      motion_model: "DiffDrive"
      visualize: true
      TrajectoryVisualizer:
        # Publish one candidate plus the optimized trajectory, not all 1000 samples.
        trajectory_step: 1000
        time_step: 10
      reset_period: 0.08
      regenerate_noises: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "CorridorCritic"]
      CorridorCritic:
        enabled: true
        # Preferred clearance beyond the padded body; fitted corridor is a soft cost.
        side_margin: 0.03
        clearance_weight: 30.0
        center_weight: 30.0
        heading_weight: 12.0
        max_heading_degrees: 10.0
        geometry_timeout: 2.5
      ConstraintCritic: #是否违反速度约束
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic: #主要负责躲避障碍
        enabled: true
        cost_power: 1
        cost_weight: 6.0 #躲避障碍的代价权重
        critical_cost: 253.0 #接近致命障碍的代价阈值
        consider_footprint: true # 11-14: 用 0.80x0.62 多边形而非 0.3 圆
        collision_cost: 1000000.0 #碰撞代价
        near_goal_distance: 0.2 #在这个距离内，障碍物代价会被降低，以帮助机器人更容易地到达目标
        trajectory_point_step: 1 #
      GoalCritic: #确保机器人接近目标
        enabled: true
        cost_power: 1
        cost_weight: 5.0  # 11-08: was 20.0 (Nav2 default 5.0)
        threshold_to_consider: 2.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0  # 11-08: was 8.0 (Nav2 default 14.0)
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.8
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic: #是否跟随全局路径
        enabled: true
        cost_power: 1
        cost_weight: 5.0  # 11-08: was 20.0 (Nav2 default 5.0)
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic: #确保机器人朝向与全局路径一致 
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
        max_angle_to_furthest: 1.0
        mode: 0


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 15.0
      global_frame: map
      robot_base_frame: base_frame
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.02
      # 11-14: 车体实际外廓 0.80 x 0.62 m (内切 0.31 / 外接 0.506); 圆模型 0.3 低估横向 1cm、忽略前后角
      footprint: "[[0.21, 0.31], [0.21, -0.31], [-0.59, -0.31], [-0.59, 0.31]]"
      # plugins: ["static_layer", "stvl_layer", "inflation_layer", "denoise_layer"]
      plugins: ["stvl_layer", "inflation_layer", "denoise_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        # https://github.com/SteveMacenski/spatio_temporal_voxel_layer
        enabled:                  true
        voxel_decay:              0.5                               # 如果是线性衰减，单位为秒；如果是指数衰减，则为 e 的 n 次方
        decay_model:              0                                 # 衰减模型，0=线性，1=指数，-1=持久
        voxel_size:               0.05                              # 每个体素的尺寸，单位为米
        track_unknown_space:      true                              # default space is unknown
        mark_threshold:           0                                 # voxel height
        update_footprint_enabled: true
        combination_method:       1                                 # 1=max, 0=override
        origin_z:                 0.0                               # 单位为米
        publish_voxel_map:        true                              # default false, 是否发布体素地图
        transform_tolerance:      0.2                               # 单位为秒
        mapping_mode:             false                             # default off, saves map not for navigation
        map_save_duration:        60.0                              # default 60s, how often to autosave
        observation_sources:      livox_mark livox_clear
        livox_mark:
          data_type: PointCloud2
          # topic: /cloud_registered
          topic: /terrain_map
          marking: true
          clearing: false
          obstacle_range: 30.0                                       # meters
          min_obstacle_height: -2.0                                 # default 0, meters
          max_obstacle_height: 2.0                                  # default 3, meters
          expected_update_rate: 0.0                                 # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0                              # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false                                       # default false, for laser scans
          filter: "voxel"                                           # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
          voxel_min_points: 0                                       # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true                                 # default false, clear the buffer after the layer gets readings from it
        livox_clear:
          enabled: true                                             # default true, can be toggled on/off with associated service call
          data_type: PointCloud2
          # topic: /cloud_registered
          topic: /terrain_map
          marking: false
          clearing: true
          max_z: 8.0                                                # default 10, meters
          min_z: -1.0                                                # default 0, meters
          vertical_fov_angle: 1.029                                 # 垂直视场角，单位为弧度，For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_padding: 0.05                                # 3D Lidar only. Default 0, in meters
          horizontal_fov_angle: 6.29                                # 3D 激光雷达水平视场角
          decay_acceleration: 5.0                                   # default 0, 1/s^2.
          model_type: 1                                             # 0=深度相机，1=3D激光雷达
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.15
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_subscribe_transient_local: True
      # always_send_full_costmap: true


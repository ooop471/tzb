behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    # recovery_plugins: ["spin", "backup", "assisted_teleop", "wait"]
    recovery_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    robot_base_frame: base_frame
    transform_timeout: 0.1
    use_sim_time: True
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.20
    min_rotational_vel: 0.06
    rotational_acc_lim: 0.4

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 0.35]
    min_velocity: [-0.10, 0.0, -0.35]  # short reverse recovery; MPPI vx_min remains zero
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [0.4, 0.0, 1.2]
    max_decel: [-0.6, 0.0, -1.2]
    odom_topic: "odometry"
    odom_duration: 0.1

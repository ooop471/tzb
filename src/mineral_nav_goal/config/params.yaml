mineral_nav_goal:
  ros__parameters:
    target_class: "white block"
    detection_topic: "/yolo/detections"
    pointcloud_topic: "/camera/depth/color/points"
    camera_info_topic: "/camera/color/camera_info"
    base_frame: "base_link"
    map_frame: "map"
    goal_topic: "/mineral_nav_goal/goal_pose"
    target_topic: "/mineral_nav_goal/target_point"
    standoff_m: 0.30
    min_standoff_m: 0.20
    max_standoff_m: 0.40
    inner_wheel_width_m: 0.30
    side_clearance_m: 0.03
    min_confidence: 0.40
    min_stable_detections: 3
    max_cloud_age_sec: 0.50
    max_sync_error_sec: 0.25
    send_nav_goal: false
    action_name: "navigate_to_pose"

pose_estimation_node:
  ros__parameters:

    model_path: "/home/tzb/tzb_ws/src/pose_estimator/config/half_block.pcd"

    # Topics
    pointcloud_topic: "/camera/depth/color/points"
    detection_topic: "/yolo/detections"
    # 类别优先级（d 是错误标注，永久排除）；blue_block 沿用 model_path 的 half_block.pcd
    target_classes: ["blue_block", "big_rock", "small_rock"]
    ignored_classes: ["d"]
    # 每类位姿模型：留空则自动在 config/ 下找 <class>.pcd（big_rock.pcd / small_rock.pcd）
    class_models: ""
    # 每类模型几何参数覆盖（可选），例如小石头可减小 feature_radius
    class_model_params: ""
    object_pose_topic: "/pose_estimator/object_pose"
    pose_yaw: 0.0
    use_detected_yaw: true
    roi_median_position: true
    grasp_position_source: "model_center"   # roi_median=旧行为; model_center=模型AABB中心
    object_pose_offset_xyz: [0.0, 0.0, 0.0]
    camera_info_topic: "/camera/color/camera_info"
    camera_frame: ""

    # Complete model: about 10k points, 0.1 x 0.1 x 0.15 m.
    # The model is not downsampled. Only the scene ROI uses this voxel grid.
    scene_voxel_size: 0.002

    # Normals are used only by the single-scale FPFH global registration.
    normal_radius: 0.006
    normal_max_nn: 50
    feature_radius: 0.015
    feature_max_nn: 100
    model_auto_unit_scale: true

    # One FPFH/RANSAC hypothesis. Full-model-to-visible-surface overlap is
    # intentionally not used as a quality gate.
    global_ransac_enable: true
    global_ransac_retry_interval_sec: 0.05
    ransac_n: 3
    ransac_max_iter: 50000
    ransac_dist_thresh: 0.008
    ransac_mutual_filter: False
    ransac_confidence: 0.999
    ransac_edge_length_ratio: 0.85

    # Scene-side quality: for every ROI point, query its nearest transformed
    # model point. Coverage uses scene_coverage_dist_thresh.
    scene_coverage_dist_thresh: 0.003
    coarse_min_scene_coverage: 0.23
    coarse_max_scene_median: 0.015
    icp_min_scene_coverage: 0.45
    icp_max_scene_median: 0.005
    tracking_min_scene_coverage: 0.35
    tracking_max_scene_median: 0.006

    # One Point-to-Point ICP. A candidate outside the trust region, or one
    # that degrades coverage/median beyond the voxel-scale tolerance, falls
    # back to the RANSAC input.
    icp_dist_thresh: 0.008
    icp_max_iter: 60
    icp_relative_fitness: 5.0e-5
    icp_relative_rmse: 5.0e-5
    global_icp_max_translation: 0.025
    global_icp_max_axis_deg: 25.0
    icp_max_scene_coverage_drop: 0.02
    icp_max_scene_median_increase: 0.001

    # Previous-pose Point-to-Point tracking.
    tracking_icp_dist_thresh: 0.005
    tracking_icp_max_iter: 30
    max_tracking_translation_jump: 0.020
    max_tracking_rotation_jump_deg: 30.0
    axisymmetric_ignore_yaw_jump: true
    roi_timeout_sec: 1.5

    # RViz: downsampled ROI, blue accepted RANSAC input, green final/tracking.
    publish_roi_cloud: true
    publish_model_marker: true
    publish_coarse_pose: true
    publish_coarse_marker: true
    viz_publish_every_n: 3

    # ROI crop and detector gating.
    bbox_expand_ratio: 0.10
    # Per-side padding relative to the detected bbox. The old 0.03/0.02 left the
    # ROI with essentially no support surface at all (measured: identical point
    # counts with the ROI filters on and off), which is why purging never changed
    # a sand result. A wider box also stops a slightly small detector box
    # (21 px vs a 28 px block) from starving the cloud; the filters below then
    # take the support surface back out.
    bbox_expand_ratio_long: 0.25
    bbox_expand_ratio_width: 0.15
    rough_crop_pad_ratio: 0.35
    min_scene_points: 250
    det_min_score: 0.05
    bbox_smoothing_enable: true
    bbox_ema_alpha: 0.65

    # ROI purging before registration. Coverage divides by every point sent to
    # registration, so the support surface (floor / sand) subtracts from the
    # object's share and a correct pose can still fail the gate. Two stages,
    # each with its own switch and reason code in [ROI FILTER] logs.
    # 1) drop the dominant support plane; refuses to fire when the plane is the
    #    nearer surface (that would be the block's own top face).
    roi_plane_removal_enable: true
    # Sand is rougher than a concrete floor: 5 mm is tuned for concrete, 8 mm
    # keeps a granular surface inliers without swallowing a 50 mm block.
    roi_plane_dist_thresh: 0.008
    roi_plane_min_inlier_ratio: 0.15
    roi_plane_min_keep_ratio: 0.25
    roi_plane_require_farther: true
    roi_plane_max_iter: 200
    # 2) keep only the qualified foreground component. The extractor already
    #    computed it for the navigation hint; before this it was judged but
    #    never used to crop the cloud.
    roi_foreground_purge_enable: true
    roi_purged_min_points: 120
    # Keep points within this distance of the qualified component: dropping the
    # block's own edge/occlusion points lowers coverage instead of raising it.
    roi_purge_margin: 0.015

    # Motion-time coarse candidate: detector bbox + depth median, no FPFH/RANSAC.
    candidate_topic: "/perception/candidate"
    candidate_enable: true
    candidate_min_score: 0.12
    candidate_min_points: 30

    # Skip the precise registration while the rover is only exploring.
    # /mission/state is already published by rover_state at 20 Hz.
    registration_gate_enabled: true
    mission_state_topic: "/mission/state"
    mission_state_timeout_sec: 1.0
    registration_on_states:
      - STOPPING
      - LOCALIZING
      - PLANNING
      - APPROACHING
      - SETTLING
      - READY_TO_GRASP
      - GRASPING

    timing_log_enable: true
    timing_log_throttle_sec: 5.0
